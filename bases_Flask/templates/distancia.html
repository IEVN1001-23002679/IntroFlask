
{% extends "layout.html" %}
{% block container %}

<h1>Distancia entre dos puntos</h1>

<form action="/distancia" method="POST">

    <div class="mb-3">
        <label class="form-label">Punto A - X1:</label>
        <input type="number" step="any" class="form-control" name="a1" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Punto A - Y1:</label>
        <input type="number" step="any" class="form-control" name="a2" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Punto B - X2:</label>
        <input type="number" step="any" class="form-control" name="b1" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Punto B - Y2:</label>
        <input type="number" step="any" class="form-control" name="b2" required>
    </div>

    <button type="submit" class="btn btn-primary">Calcular</button>

</form>

<h2 class="mt-4">
    La distancia es: {{ "%.2f"|format(total) }}
</h2>

{% endblock %}
